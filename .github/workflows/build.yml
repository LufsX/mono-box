name: build and publish architecture packages

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      tag_name: ${{ steps.ref.outputs.tag_name }}
      source_sha: ${{ steps.ref.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve source
        id: ref
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = prerelease ]; then
            TAG_NAME=Prerelease
            SOURCE_SHA="$GITHUB_SHA"
          elif [ "$CHANNEL" = release ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              TAG_NAME="$GITHUB_REF_NAME"
              SOURCE_SHA="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            else
              TAG_NAME="$(git tag --sort=-version:refname | awk '/^v/ { print; exit }')"
              [ -n "$TAG_NAME" ] || { echo "No v* release tag found" >&2; exit 1; }
              SOURCE_SHA="$(git rev-parse "${TAG_NAME}^{commit}")"
            fi
          else
            echo "Unknown release channel: $CHANNEL" >&2
            exit 1
          fi
          {
            echo "tag_name=$TAG_NAME"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            git checkout --detach "$SOURCE_SHA"
          fi

      - name: Read metadata
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG_NAME: ${{ steps.ref.outputs.tag_name }}
        run: |
          VERSION="$(awk -F= '/^version=/ { print $2; exit }' module.prop)"
          if [ "$CHANNEL" = release ] && [ "$VERSION" != "$TAG_NAME" ]; then
            echo "module.prop version ($VERSION) must match release tag ($TAG_NAME)" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "version_code=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - name: Build WebUI
        working-directory: webui
        run: |
          pnpm install
          pnpm run build

      - name: Upload shared WebUI
        uses: actions/upload-artifact@v7
        with:
          name: shared-webui-${{ steps.ref.outputs.source_sha }}
          path: dist/webui/
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download shared WebUI
        uses: actions/download-artifact@v8
        with:
          name: shared-webui-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/shared-webui

      - name: Setup UPX
        run: |
          curl -fsSL --retry 3 https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz -o "$RUNNER_TEMP/upx.tar.xz"
          tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/upx-4.2.4-amd64_linux" >> "$GITHUB_PATH"

      - name: Build architecture package
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ inputs.channel }}
          MONOBOX_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          WEBUI_DIR: ${{ runner.temp }}/shared-webui
        run: |
          if [ "$CHANNEL" = prerelease ]; then
            sh build.sh --prerelease --arch "$BUILD_ARCH" --webui-dir "$WEBUI_DIR"
          else
            sh build.sh --arch "$BUILD_ARCH" --webui-dir "$WEBUI_DIR"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: monobox-${{ matrix.arch }}
          path: |
            dist/MonoBox_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.zip
            dist/update-${{ matrix.arch }}.json
            dist/update.json
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: monobox-*
          merge-multiple: true
          path: dist

      - name: Generate changelog
        run: |
          if [ "$CHANNEL" = prerelease ]; then
            {
              echo "# Prerelease"
              echo
              git log -n 10 "$SOURCE_SHA" --pretty=format:'- %s (%h)'
              echo
            } > dist/prerelease-changelog.md
          else
            PREV_TAG="$(git tag --merged "$SOURCE_SHA" --sort=-version:refname | awk -v current="$TAG_NAME" '/^v/ && $0 != current { print; exit }')"
            {
              echo "# Changelog"
              echo
              echo "## $TAG_NAME"
              echo
              if [ -n "$PREV_TAG" ]; then
                git log "$PREV_TAG..$SOURCE_SHA" --pretty=format:'- %s (%h)'
              else
                git log "$SOURCE_SHA" --pretty=format:'- %s (%h)'
              fi
              echo
            } > dist/changelog.md
          fi

      - name: Verify release tag still matches the build
        if: ${{ inputs.channel == 'release' }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG_NAME"
          TAG_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [ "$TAG_SHA" = "$SOURCE_SHA" ] || { echo "Release tag changed while packages were building" >&2; exit 1; }

      - name: Verify prerelease source does not roll back the published tag
        if: ${{ inputs.channel == 'prerelease' }}
        run: |
          if git ls-remote --exit-code origin refs/tags/Prerelease; then
            git fetch --no-tags origin refs/tags/Prerelease
            TAG_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
            git merge-base --is-ancestor "$TAG_SHA" "$SOURCE_SHA" || {
              echo "Prerelease tag is not an ancestor of this build; refusing to overwrite published assets" >&2
              exit 1
            }
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then
              echo "Failed to read remote Prerelease tag (git exit $STATUS)" >&2
              exit "$STATUS"
            fi
          fi

      - name: Upload packages and changelog
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          prerelease: ${{ inputs.channel == 'prerelease' }}
          files: |
            dist/MonoBox_*.zip
            dist/*changelog.md
          body_path: ${{ inputs.channel == 'prerelease' && 'dist/prerelease-changelog.md' || 'dist/changelog.md' }}
          fail_on_unmatched_files: true

      - name: Upload update manifests
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          prerelease: ${{ inputs.channel == 'prerelease' }}
          files: |
            dist/update-*.json
            dist/update.json
          fail_on_unmatched_files: true

      - name: Point prerelease tag at the published source
        if: ${{ inputs.channel == 'prerelease' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/Prerelease" \
            -f sha="$SOURCE_SHA" -F force=true

      - name: Remove superseded module assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/monobox-release-assets.json"
          python3 - "$RUNNER_TEMP/monobox-release-assets.json" <<'PY'
          import json, os, subprocess, sys
          version = os.environ["VERSION"]
          keep = {f"MonoBox_{version}_{arch}.zip" for arch in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86")}
          for asset in json.load(open(sys.argv[1]))["assets"]:
              name = asset["name"]
              if name.startswith("MonoBox_") and name.endswith(".zip") and name not in keep:
                  subprocess.run(["gh", "release", "delete-asset", os.environ["TAG_NAME"], name,
                                  "--repo", os.environ["GITHUB_REPOSITORY"], "--yes"], check=True)
          PY
