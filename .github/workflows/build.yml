name: build and publish architecture packages

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

permissions:
  contents: read

env:
  npm_config_manage_package_manager_versions: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      tag_name: ${{ steps.ref.outputs.tag_name }}
      source_sha: ${{ steps.ref.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve source
        id: ref
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = prerelease ]; then
            TAG_NAME=Prerelease
            SOURCE_SHA="$GITHUB_SHA"
          elif [ "$CHANNEL" = release ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              TAG_NAME="$GITHUB_REF_NAME"
              SOURCE_SHA="$(git rev-parse "${GITHUB_SHA}^{commit}")"
              TAG_SHA="$(git rev-parse "${TAG_NAME}^{commit}")"
              [ "$TAG_SHA" = "$SOURCE_SHA" ] || { echo "Release tag moved since this run was triggered" >&2; exit 1; }
            else
              TAG_NAME="$(git tag --sort=-version:refname | awk '/^v/ { print; exit }')"
              [ -n "$TAG_NAME" ] || { echo "No v* release tag found" >&2; exit 1; }
              SOURCE_SHA="$(git rev-parse "${TAG_NAME}^{commit}")"
            fi
          else
            echo "Unknown release channel: $CHANNEL" >&2
            exit 1
          fi
          {
            echo "tag_name=$TAG_NAME"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.source_sha }}

      - name: Read metadata
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG_NAME: ${{ steps.ref.outputs.tag_name }}
        run: |
          VERSION="$(awk -F= '/^version=/ { print $2; exit }' module.prop)"
          [ -n "$VERSION" ] || { echo "Missing module version" >&2; exit 1; }
          if [ "$CHANNEL" = release ] && [ "$VERSION" != "$TAG_NAME" ]; then
            echo "module.prop version ($VERSION) must match release tag ($TAG_NAME)" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "version_code=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check release asset validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check native controller
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go vet ./...

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          package_json_file: webui/package.json

      - name: Check WebUI
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          node --test tests/*.test.mjs

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.source_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          package_json_file: webui/package.json

      - name: Setup UPX
        run: |
          curl -fsSL --retry 3 https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz -o "$RUNNER_TEMP/upx.tar.xz"
          tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/upx-4.2.4-amd64_linux" >> "$GITHUB_PATH"

      - name: Build architecture package
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ inputs.channel }}
          MONOBOX_VERSION_CODE: ${{ needs.check.outputs.version_code }}
        run: |
          if [ "$CHANNEL" = prerelease ]; then
            sh build.sh --prerelease --arch "$BUILD_ARCH"
          else
            sh build.sh --arch "$BUILD_ARCH"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: monobox-${{ matrix.arch }}
          path: |
            MonoBox_${{ needs.check.outputs.version }}_${{ matrix.arch }}.zip
            update-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      VERSION_CODE: ${{ needs.check.outputs.version_code }}
      TAG_NAME: ${{ needs.check.outputs.tag_name }}
      SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: monobox-*
          merge-multiple: true
          path: dist

      - name: Verify release assets
        run: |
          python3 .github/scripts/verify-release.py dist \
            --version "$VERSION" --version-code "$VERSION_CODE" \
            --tag "$TAG_NAME" --repository "$GITHUB_REPOSITORY"

      - name: Generate changelog
        run: |
          if [ "$CHANNEL" = prerelease ]; then
            {
              echo "# Prerelease"
              echo
              git log -n 10 "$SOURCE_SHA" --pretty=format:'- %s (%h)'
              echo
            } > dist/prerelease-changelog.md
          else
            PREV_TAG="$(git tag --merged "$SOURCE_SHA" --sort=-version:refname | awk -v current="$TAG_NAME" '/^v/ && $0 != current { print; exit }')"
            {
              echo "# Changelog"
              echo
              echo "## $TAG_NAME"
              echo
              if [ -n "$PREV_TAG" ]; then
                git log "$PREV_TAG..$SOURCE_SHA" --pretty=format:'- %s (%h)'
              else
                git log "$SOURCE_SHA" --pretty=format:'- %s (%h)'
              fi
              echo
            } > dist/changelog.md
          fi

      - name: Verify release tag still matches the build
        if: ${{ inputs.channel == 'release' }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG_NAME"
          TAG_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [ "$TAG_SHA" = "$SOURCE_SHA" ] || { echo "Release tag changed while packages were building" >&2; exit 1; }

      - name: Upload packages and changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag_name }}
          target_commitish: ${{ needs.check.outputs.source_sha }}
          prerelease: ${{ inputs.channel == 'prerelease' }}
          files: |
            dist/MonoBox_*.zip
            dist/*changelog.md
          body_path: ${{ inputs.channel == 'prerelease' && 'dist/prerelease-changelog.md' || 'dist/changelog.md' }}
          fail_on_unmatched_files: true

      - name: Upload architecture update manifests
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag_name }}
          target_commitish: ${{ needs.check.outputs.source_sha }}
          prerelease: ${{ inputs.channel == 'prerelease' }}
          files: dist/update-*.json
          fail_on_unmatched_files: true

      - name: Point prerelease tag at the published source
        if: ${{ inputs.channel == 'prerelease' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/Prerelease" \
            -f sha="$SOURCE_SHA" -F force=true

      - name: Remove superseded module assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/monobox-release-assets.json"
          python3 - "$RUNNER_TEMP/monobox-release-assets.json" <<'PY'
          import json, os, subprocess, sys
          version = os.environ["VERSION"]
          keep = {f"MonoBox_{version}_{arch}.zip" for arch in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86")}
          for asset in json.load(open(sys.argv[1]))["assets"]:
              name = asset["name"]
              if name == "update.json" or (name.startswith("MonoBox_") and name.endswith(".zip") and name not in keep):
                  subprocess.run(["gh", "release", "delete-asset", os.environ["TAG_NAME"], name,
                                  "--repo", os.environ["GITHUB_REPOSITORY"], "--yes"], check=True)
          PY
