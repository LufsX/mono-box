name: prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
    tags-ignore:
      - "v*"

permissions:
  contents: write

concurrency:
  group: monobox-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    uses: ./.github/workflows/build.yml
    with:
      channel: prerelease
